}

}

}

  const A = hexToRgb(a), B = hexToRgb(b);
  t = clamp(t, 0, 1);
  return 'rgba(' + Math.round(lerp(A[0], B[0], t)) + ',' + Math.round(lerp(A[1], B[1], t)) + ',' + Math.round(lerp(A[2], B[2], t)) + ',' + clamp(alpha, 0, 1) + ')';

}

  const a = omega * omega * (target - s.x) - 2 * zeta * omega * s.v;

/* ---------- 画布与相机 ---------- */
function resizeCanvas() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(W * DPR));
  canvas.height = Math.max(1, Math.round(H * DPR));
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  makeStars();
  if (input) {
    input.style.width = 'min(' + CFG.capture.width + 'px, calc(100vw - 32px))';

    input.style.fontSize = (W <= 600 ? CFG.text.itemSize : CFG.text.size) + 'px';

function worldToScreen(x, y) {
  return { x: (x - cam.x) * cam.zoom + W / 2, y: (y - cam.y) * cam.zoom + H / 2 };
}

  return { x: (x - W / 2) / cam.zoom + cam.x, y: (y - H / 2) / cam.zoom + cam.y };
}
function nodeScreenCenter(n) {
  const p = worldToScreen(n.pos.x, n.pos.y);
  p.x += n.lean.x;
  p.y += n.lean.y;
  return p;
}

function makeStars() {
  stars.length = 0;
  const rng = seededRandom(0x5A17C0DE);
  for (let i = 0; i < 140; i++) {
    stars.push({
      x: rng() * W,
      y: rng() * H,
      r: randRange(rng, 0.6, 1.6),
      a: randRange(rng, 0.25, 0.7),
      period: randRange(rng, 4, 9),
      phase: rng() * TAU
    });
  }
}

  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  const noteSize = 11, noteTextSize = 12, noteGap = 4;
  for (const geo of lineGeos) {
    const link = geo.link;
    if (link.fading || !link.note) continue;
    const mid = pointAtPolyline(geo.g.points, 0.5);
    mid.y -= CFG.text.labelSize;
    ctx.font = fontString(noteTextSize, 400);
    const textW = ctx.measureText(link.note).width;
    const total = noteSize + noteGap + textW;
    const rect = { l: mid.x - total / 2, r: mid.x + total / 2, t: mid.y - 6, b: mid.y + 6 };
    const q = expandRect(rect, 4);
    if (labelTaken.some(t => q.l < t.r && q.r > t.l && q.t < t.b && q.b > t.t)) continue;
    let blocked = false;
    for (const n of nodes) {
      if (n.removing || n.alpha < 0.05) continue;
      if (n.delayUntil && now < n.delayUntil) continue;
      if (rectOverlapArea(q, nodeScreenBox(n, 4)) > 0) { blocked = true; break; }
    }
    if (blocked) continue;
    labelTaken.push(q);
    const alpha = 0.95 * geo.dim;
    const iconX = rect.l + noteSize / 2;
    ctx.globalAlpha = 1;
    drawNoteIcon(iconX, mid.y, noteSize, '#FFE7C2', alpha);
    drawLabelText(link.note, rect.l + noteSize + noteGap + textW / 2, mid.y, noteTextSize, '#FFE7C2', alpha);
  }
  const suggestions = [];
  for (const geo of lineGeos) {
    if (geo.link.fading || geo.link.note) continue;
    if (geo.link.kind === 'suggest') {
      const p = pointAtPolyline(geo.g.points, 0.5);
      p.y -= CFG.text.labelSize;
      const d = dist2(p.x, p.y, W / 2, H / 2);
      suggestions.push({ geo: geo, p: p, d: d });
    }
  }
  const selected = [];
  if (hoverSuggestLabel) {
    const h = suggestions.find(x => x.geo.link === hoverSuggestLabel);
    if (h) selected.push(h);
  }
  if (hoverLink && hoverLink.kind === 'suggest' && !selected.some(x => x.geo.link === hoverLink)) {
    const h = suggestions.find(x => x.geo.link === hoverLink);
    if (h) selected.push(h);
  }
  suggestions.sort((a, b) => a.d - b.d);
  for (const s of suggestions) {
    if (selected.length >= CFG.line.maxLabels) break;
    if (!selected.some(x => x.geo.link === s.geo.link)) selected.push(s);
  }
  const placedLabels = [];
  const labelTs = [0.5, 0.4, 0.6, 0.3, 0.7];
  for (const s of selected) {
    const link = s.geo.link;
    const label = link.label;
    if (!label) continue;
    ctx.font = fontString(CFG.text.labelSize, 400);
    const labelW = ctx.measureText(label).width;
    const labelH = CFG.text.labelSize;
    let placed = null;
    let bestScore = Infinity;
    for (const t of labelTs) {
      const p = pointAtPolyline(s.geo.g.points, t);
      p.y -= CFG.text.labelSize;
      const rect = {
        x: p.x, y: p.y,
        l: p.x - labelW / 2, r: p.x + labelW / 2,
        t: p.y - labelH / 2, b: p.y + labelH / 2
      };
      let score = 0;
      for (const n of nodes) {
        if (n.removing || n.alpha < 0.05) continue;
        if (n.delayUntil && now < n.delayUntil) continue;
        score += rectOverlapArea(rect, nodeScreenBox(n, 4));
      }
      for (const q of labelTaken) score += rectOverlapArea(rect, q);
      for (const other of placedLabels) {
        score += rectOverlapArea(rect, expandRect(other, 4));
      }
      if (score < bestScore) {
        bestScore = score;
        placed = rect;
      }
      if (score <= 0) break;
    }
    // Nowhere free: skip this label rather than print over other text, unless the user is pointing at it.
    const pointedAt = hoverSuggestLabel === link || hoverLink === link || hoverSuggestX === link;
    if (!placed || (bestScore > 0 && !pointedAt)) continue;
    placedLabels.push(placed);
    labelTaken.push(expandRect(placed, 4));
    const w = drawLabelText(label, placed.x, placed.y, CFG.text.labelSize, CFG.text.color, 0.8 * s.geo.dim);
    const l = placed.x - w / 2 - 4;
    const r = placed.x + w / 2 + CFG.dismiss.xR * 2;
    const t = placed.y - labelH / 2 - 4;
    const b = placed.y + labelH / 2 + 4;
    labelHits.push({ kind: 'suggestLabel', link: link, l: l, r: r, t: t, b: b, x: placed.x, y: placed.y });
    if (hoverSuggestLabel === link || hoverSuggestX === link) {
      const cx = placed.x + w / 2 + CFG.dismiss.xR * 0.8;
      const cy = placed.y;
      const rr = CFG.dismiss.xR * 0.6;
      ctx.globalAlpha = s.geo.dim;
      ctx.strokeStyle = rgba('#EEF1FA', 0.6);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - rr, cy - rr); ctx.lineTo(cx + rr, cy + rr);
      ctx.moveTo(cx + rr, cy - rr); ctx.lineTo(cx - rr, cy + rr);
      ctx.stroke();
      labelHits.push({ kind: 'suggestX', link: link, x: cx, y: cy, r: CFG.dismiss.xR });
    }
  }
  for (const geo of lineGeos) {
    const link = geo.link;
    if (link.fading || !link.label) continue;
    if (link.kind !== 'confirmed' && link.kind !== 'mine') continue;
    if (!(hoverLink === link || link.showLabel || now < link.confirmLabelUntil)) continue;
    const p = pointAtPolyline(geo.g.points, 0.5);
    p.y -= CFG.text.labelSize;
    drawLabelText(link.label, p.x, p.y, CFG.text.labelSize, CFG.text.color, 0.8 * geo.dim);
  }
  for (const geo of lineGeos) {
    const link = geo.link;
    if (link.fading) continue;
    if (link.kind !== 'poss' && link.kind !== 'kept') continue;
    const child = getNode(link.b);
    if (!child || !child.lens) continue;
    // A lens tag only makes sense next to the possibility's own text, and must not cover other text.
    if (!labelsShown.has(child.id)) continue;
    const p = pointAtPolyline(geo.g.points, 0.4);
    p.y -= CFG.text.lensSize * 0.5;
    ctx.font = fontString(CFG.text.lensSize, 400);
    const lw = ctx.measureText(child.lens).width, lh = CFG.text.lensSize;
    const lr = { l: p.x - lw / 2 - 2, r: p.x + lw / 2 + 2, t: p.y - lh / 2 - 2, b: p.y + lh / 2 + 2 };
    if (labelTaken.some(q => lr.l < q.r && lr.r > q.l && lr.t < q.b && lr.b > q.t)) continue;
    labelTaken.push(lr);
    const alpha = 0.6 * child.alpha * nodeDimFactor(child);
    drawLabelText(child.lens, p.x, p.y, CFG.text.lensSize, child.hue, alpha);
  }
  ctx.restore();
}
function drawHintPreview(now) {
  if (!hoverPreview) return;

  const alpha = hoverPreview.pending ? 0.25 : 0.15 + 0.65 * hoverPreview.strength;
  let p0 = hoverPreview.a, p1 = hoverPreview.b;
  if (viewMode === 'ball') {

    if (a && b) {
      p0 = circleEdge(hoverPreview.a.x, hoverPreview.a.y, ballRadiusScreen(a) + 2, hoverPreview.b.x, hoverPreview.b.y);
      p1 = circleEdge(hoverPreview.b.x, hoverPreview.b.y, ballRadiusScreen(b) + 2, hoverPreview.a.x, hoverPreview.a.y);
    }
  }

  ctx.beginPath();
  ctx.moveTo(p0.x, p0.y);
  ctx.lineTo(p1.x, p1.y);
  ctx.stroke();
  ctx.setLineDash([]);
  const mid = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
  if (hoverPreview.pending) {

      ctx.fillStyle = rgba('#EEF1FA', a);

      ctx.arc(mid.x + (i - 1) * 6, mid.y - 8, 1.8, 0, TAU);

    }
  } else if (hoverPreview.hint && hoverPreview.labelAlpha > 0.002) {

  }

function drawBand(now) {
  if (!band) return;
  const a = getNode(band.link.a), b = getNode(band.link.b);
  if (!a || !b) return;
  const A = nodeScreenCenter(a), B = nodeScreenCenter(b);
  const pS = worldToScreen(band.p.x, band.p.y);
  const tension = band.released ? band.releaseTension : band.tension;
  if (!band.released) {
    const j = band.loaded ? CFG.band.jitterMax * Math.pow(tension, 3) : 0;   // it only trembles once it is fully loaded
    pS.x += (Math.random() * 2 - 1) * j;
    pS.y += (Math.random() * 2 - 1) * j;
  }
  let ae, be;
  if (viewMode === 'ball') {
    ae = circleEdge(A.x, A.y, ballRadiusScreen(a) + 2, pS.x, pS.y);
    be = circleEdge(B.x, B.y, ballRadiusScreen(b) + 2, pS.x, pS.y);
  } else {
    const ahw = textTotalWidth(a) / 2 + CFG.text.edgePad;
    const ahh = Math.max(a.h * a.scale.x, CFG.ball.textIconPx) / 2 + CFG.text.edgePad;
    const bhw = textTotalWidth(b) / 2 + CFG.text.edgePad;
    const bhh = Math.max(b.h * b.scale.x, CFG.ball.textIconPx) / 2 + CFG.text.edgePad;
    ae = edgePoint(A.x, A.y, ahw, ahh, pS.x, pS.y);
    be = edgePoint(B.x, B.y, bhw, bhh, pS.x, pS.y);
  }
  const style = lineStyle(band.link);
  const color = tension < 0.6
    ? mixHex(style.color, CFG.band.warm, tension / 0.6)
    : mixHex(CFG.band.warm, CFG.band.hot, (tension - 0.6) / 0.4);
  let alpha = (style.alpha + (0.9 - style.alpha) * tension) * ((nodeDimFactor(a) + nodeDimFactor(b)) / 2);
  alpha = Math.max(alpha, CFG.band.grabAlpha * ((nodeDimFactor(a) + nodeDimFactor(b)) / 2));   // a rubber band is solid, not a faint thread
  // Thick when grabbed, thinner as it stretches (volume stays about the same)
  const width = Math.max(style.width, CFG.band.grabWidth) * Math.max(CFG.band.widthMin, 1 - CFG.band.widthK * tension);
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineCap = 'round';
  drawPolyline([ae, pS], color, width, alpha, []);
  drawPolyline([pS, be], color, width, alpha, []);
  if (band.loaded) {
    const g = ctx.createRadialGradient(pS.x, pS.y, 0, pS.x, pS.y, CFG.band.glowR);
    g.addColorStop(0, rgba(CFG.band.warm, CFG.band.glowA));
    g.addColorStop(1, rgba(CFG.band.warm, 0));
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(pS.x, pS.y, CFG.band.glowR, 0, TAU);
    ctx.fill();
    const G = bandG();
    const gs = worldToScreen(G.x, G.y);
    let dx = gs.x - pS.x, dy = gs.y - pS.y;
    const dl = Math.hypot(dx, dy);
    if (dl > 0.001) {
      dx /= dl; dy /= dl;
      const totalAim = dl + CFG.band.aimLen;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = rgba(CFG.band.warm, 0.25);
      for (let d = 0; d <= totalAim; d += CFG.band.aimDot) {
        ctx.beginPath();
        ctx.arc(pS.x + dx * d, pS.y + dy * d, 1.1, 0, TAU);
        ctx.fill();
      }
    }
  }
  ctx.restore();
}
function drawRetracts(now) {
  if (!retracts.length) return;
  ctx.save();
  for (const r of retracts) {
    const p = clamp((now - r.start) / CFG.breakup.retractMs, 0, 1);
    const e = easeOutCubic(p);
    const pts = subPolyline(r.points, 0, 1 - e);
    if (pts.length >= 2) drawPolyline(pts, r.color, r.width, (1 - p) * 0.9, []);
  }
  ctx.restore();
}
function drawBreakSparks(now) {
  if (!breakSparks.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const s of breakSparks) {
    const life = s.life || CFG.cut.lifeMs;
    const p = clamp((now - s.start) / life, 0, 1);
    const pos = worldToScreen(s.x, s.y);
    ctx.fillStyle = rgba(s.color, 1 - p);
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, s.size || CFG.spark.r * 0.55, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}
function drawBreakFlashes(now) {
  if (!breakFlashes.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const f of breakFlashes) {
    const p = clamp((now - f.start) / f.ms, 0, 1);
    const pos = worldToScreen(f.x, f.y);
    const radius = f.r * easeOutCubic(p);
    const color = f.color || CFG.band.hot;
    const g = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, Math.max(1, radius));
    g.addColorStop(0, rgba(color, f.a * (1 - p)));
    g.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, Math.max(1, radius), 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}
function drawRipples(now) {
  if (!ripples.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  for (const r of ripples) {
    const p = clamp((now - r.start) / r.ms, 0, 1);
    const radius = easeOutCubic(p) * r.maxR;
    ctx.strokeStyle = rgba('#DCD3FF', r.alpha * (1 - p));
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(r.x, r.y, radius, 0, TAU);
    ctx.stroke();
  }

function drawSparks() {
  if (!sparks.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const s of sparks) {
    if (!reduceMotion) {
      const n = s.trail.length;
      for (let i = n - 1; i >= 0; i--) {
        const p = worldToScreen(s.trail[i].x, s.trail[i].y);
        const k = 1 - i / Math.max(1, n);
        ctx.fillStyle = rgba(CFG.band.warm, 0.38 * k);
        ctx.beginPath();
        ctx.arc(p.x, p.y, CFG.spark.r * (0.35 + 0.5 * k), 0, TAU);
        ctx.fill();
      }
    }
    const p = worldToScreen(s.x, s.y);
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, CFG.spark.glowR);
    g.addColorStop(0, rgba(CFG.band.warm, 0.9));
    g.addColorStop(1, rgba(CFG.band.warm, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, CFG.spark.glowR, 0, TAU);
    ctx.fill();
    ctx.fillStyle = rgba('#FFF8E8', 1);
    ctx.beginPath();
    ctx.arc(p.x, p.y, CFG.spark.r, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}
function wrapHintText() {
  ctx.font = fontString(CFG.text.labelSize, 400);
  const maxW = Math.min(W - CFG.glow.padY * 2, W / 2);
  const chars = Array.from(DATA.hint);
  let line = '';
  const lines = [];
  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line);
      line = ch;
    } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function drawDemoTag(now) {
  if (!demoTag) return;
  const age = now - demoTag.start;
  let a = 0.7;
  if (age < CFG.line.fadeMs) a *= age / CFG.line.fadeMs;
  else if (age > CFG.demo.tagMs) a *= Math.max(0, 1 - (age - CFG.demo.tagMs) / CFG.line.fadeMs);
  if (a <= 0.002) return;
  const lines = wrapHintText();
  const y = CFG.glow.padY + lines.length * CFG.text.labelSize * 1.5 + CFG.dismiss.xR * 0.8;
  ctx.save();
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.font = fontString(CFG.text.labelSize, 400);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = CFG.text.color;
  ctx.shadowColor = CFG.text.shadow;
  ctx.shadowBlur = CFG.text.shadowBlur;
  ctx.fillText(demoTag.text, W / 2, y);
  ctx.restore();
}
function drawHint(now) {
  if (hintGone && now - hintFadeStart >= CFG.line.fadeMs) return;
  let a = 0.55;
  if (hintGone) a *= Math.max(0, 1 - (now - hintFadeStart) / CFG.line.fadeMs);
  if (a <= 0.002) return;
  ctx.save();
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.font = fontString(CFG.text.labelSize, 400);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = CFG.text.color;
  const lines = wrapHintText();
  const lh = CFG.text.labelSize * 1.5;
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], CFG.glow.padY, CFG.glow.padY + i * lh);
  }
  ctx.restore();
}
function render(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.setLineDash([]);
  ctx.shadowBlur = 0;

  drawCursorHalo();
  drawLineLayer(now);
  drawHintPreview(now);
  drawConnectPreview();
  drawCutTrail(now);
  drawBand(now);
  drawWhips(now);
  drawRetracts(now);
  drawBreakSparks(now);
  drawBreakFlashes(now);
  drawRipples(now);
  drawPulses(now);
  drawLineLabels(now);
  if (viewMode === 'ball') {
    for (const n of nodes) drawBallGlow(n, now);
    for (const n of nodes) drawBall(n, now);
    drawBallLabels(now);
  } else {
    for (const n of nodes) drawNodeGlow(n, now);
    for (const n of nodes) drawNodeText(n, now);
    drawTextModeDots(now);
  }
  drawSparks();
  drawDemoTag(now);
  drawHint(now);
}

function applyLeanTargets() {
  if (!pointer.inside) return;
  const pw = screenToWorld(pointer.x, pointer.y);
  for (const n of nodes) {
    if (n.removing) continue;
    if (drag && drag.node === n) continue;   // the node under the cursor must not lean towards its own cursor
    const dx = pw.x - n.pos.x, dy = pw.y - n.pos.y;
    const d = Math.hypot(dx, dy);
    if (d < CFG.cursor.radius && d > 0.001) {
      const k = CFG.cursor.leanPx * Math.pow(1 - d / CFG.cursor.radius, 2);
      n.leanTarget.x += (dx / d) * k;
      n.leanTarget.y += (dy / d) * k;
    }
  }
  if (band && !band.released && band.tension > 0) {
    const a = getNode(band.link.a), b = getNode(band.link.b);
    if (a) {
      a.leanTarget.x += (band.p.x - a.pos.x) * CFG.band.leanK * band.tension;
      a.leanTarget.y += (band.p.y - a.pos.y) * CFG.band.leanK * band.tension;
    }
    if (b) {
      b.leanTarget.x += (band.p.x - b.pos.x) * CFG.band.leanK * band.tension;
      b.leanTarget.y += (band.p.y - b.pos.y) * CFG.band.leanK * band.tension;
    }
  }
}
function updateNodeCreaks() {
  if (pointerState !== POINTER.DRAG_NODE || !drag) return;
  const n = drag.node;
  for (const l of links) {
    if (l.a !== n.id && l.b !== n.id) continue;
    if (band && band.link === l) continue;
    const a = getNode(l.a), b = getNode(l.b);
    if (!a || !b) continue;
    const L = worldDistanceNodes(a, b);
    const stretch = L - l.L0;
    const t = clamp(stretch / CFG.breakup.snapStretch, 0, 1);
    if (t >= CFG.sound.creak.nodeDragFrom) {
      if (t >= l.lastNodeCreak + CFG.sound.creak.stepT) {
        creak(t, CFG.sound.creak.nodeDragScale);
        l.lastNodeCreak = t;
      }
    } else if (t < l.lastNodeCreak) {
      l.lastNodeCreak = t;
    }
  }
}

function loop(now) {
  const raw = (now - lastFrame) / 1000;
  lastFrame = now;
  if (raw > 0) fps = fps * 0.9 + (1 / raw) * 0.1;
  const dt = Math.min(Math.max(raw, 0.00001), CFG.sim.maxFrame);
  tickDemo(now);
  updatePending(now);
  simStep(dt);
  const subs = Math.max(1, Math.ceil(dt / CFG.sim.substep));
  const h = dt / subs;
  for (let i = 0; i < subs; i++) {
    updateCursor(h);
    updateCamera(h);
    updateBand(h, now);
    updateDragInteraction();
    applyLeanTargets();
    updateAllNodes(h, now);
    updateLinksMid(h);
    updateSparks(h, now);
    updateBreakSparks(h);
    updateWhips(h, now);
  }
  checkBreakups(now);
  updateNodeCreaks();
  updatePending(now);
  updateRipples(now);
  updateRetracts(now);
  updateHoverState();
  placeLabels(now);
  if (!hintGone && now - startedAt >= CFG.hint.ms) hideHint();
  updateDebug(now);
  render(now);
  if (selftestPending) {
    selftestPending = false;
    console.log('SELFTEST v4 nodes=' + nodes.length + ' links=' + links.length +
      ' zoom=' + cam.zoom.toFixed(2) + ' mode=' + viewMode +
      ' labels=' + labelsShown.size + ' labelOverlaps=' + labelOverlapCount() +
      ' tool=' + tool + ' hints=' + DATA.hints.length);
  }
  requestAnimationFrame(loop);
}

/* ---------- 输入与事件 ---------- */
function onInputChanged() {
  if (captureTimer) clearTimeout(captureTimer);
  captureActive = false;
  captureHighlight = new Set();
  captureScores = new Map();
  if (!input.value.trim()) return;
  captureTimer = setTimeout(() => {
    captureTimer = null;
    computeCaptureHighlights();
    captureActive = captureHighlight.size > 0 || !!input.value.trim();
  }, CFG.capture.debounceMs);
}
function onInputKeyDown(e) {
  if (e.key === 'Enter') {
    if (e.isComposing || e.keyCode === 229) return;
    if (input.value.trim()) {
      e.preventDefault();
      if (captureTimer) { clearTimeout(captureTimer); captureTimer = null; }
      submitIdea(input.value);
    }
  }
}
function onGlobalKeyDown(e) {
  ensureAudio();
  if (noteEditing) return;
  if (e.altKey && (e.code === 'KeyM' || e.key === 'm' || e.key === 'M')) {
    e.preventDefault();
    toggleMute();
    return;
  }
  if (e.altKey && (e.code === 'KeyV' || e.key === 'v' || e.key === 'V')) {
    e.preventDefault();
    toggleViewMode();
    return;
  }
  if (e.key === '`' || e.code === 'Backquote') {
    e.preventDefault();
    toggleDebug();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
    if (document.activeElement === input && input.value) return;
    if (document.activeElement === noteInput) return;
    e.preventDefault();
    undoCut();
    return;
  }
  if (e.key === 'Escape') {
    e.preventDefault();
    if (tool !== 'pointer') { setTool('pointer'); return; }
    if (focus) { clearFocus(); return; }
    if (!input.value.trim()) dismissAllPoss();
    return;
  }
  if (document.activeElement === input) return;
  if (!e.ctrlKey && !e.metaKey && !e.altKey && typeof e.key === 'string' && Array.from(e.key).length === 1) {
    e.preventDefault();
    input.focus({ preventScroll: true });
    const start = input.selectionStart == null ? input.value.length : input.selectionStart;
    const end = input.selectionEnd == null ? start : input.selectionEnd;
    input.value = input.value.slice(0, start) + e.key + input.value.slice(end);
    const pos = start + e.key.length;
    try { input.setSelectionRange(pos, pos); } catch (err) { /* ignore */ }
    onInputChanged();
  }
}
function attachEvents() {
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerCancel);
  canvas.addEventListener('pointerleave', onPointerLeave);
  canvas.addEventListener('pointerenter', onPointerEnter);
  canvas.addEventListener('wheel', onWheel, { passive: false });
  window.addEventListener('keydown', onGlobalKeyDown);
  window.addEventListener('pointerdown', ensureAudio, true);
  // pointerdown does not count as a real gesture for touch, so wake the sound on every other kind too
  for (const type of ['pointerup', 'click', 'touchend', 'keydown']) window.addEventListener(type, ensureAudio, true);
  input.addEventListener('input', onInputChanged);
  input.addEventListener('keydown', onInputKeyDown);
  muteBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
  muteBtn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    ensureAudio();
    toggleMute();
  });
  if (modeBall) modeBall.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); if (viewMode !== 'ball') toggleViewMode(); });
  if (modeText) modeText.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); if (viewMode !== 'text') toggleViewMode(); });
  for (const b of toolButtons) b.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); setTool(b.getAttribute('data-tool')); });
  for (const b of brushSwatches) b.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); setBrushKind(b.getAttribute('data-brush')); });
  if (noteInput) {
    noteInput.addEventListener('keydown', onNoteKeyDown);
    noteInput.addEventListener('blur', onNoteBlur);
    noteInput.addEventListener('pointerdown', (e) => e.stopPropagation());
  }
  window.addEventListener('resize', () => { resizeCanvas(); });
}

/* ---------- 对外接口与自检 ---------- */
function buildLegend() {
  if (!legendGrid) return;
  legendGrid.textContent = '';
  const used = [];
  for (const c of DATA.constellations) {
    if (used.indexOf(c.domain) < 0) used.push(c.domain);
  }
  const list = used.map(id => DOMAIN_BY_ID.get(id)).filter(Boolean);
  for (const d of list) {
    const item = document.createElement('span');
    item.className = 'legend-item';
    const dot = document.createElement('span');
    dot.className = 'legend-dot';
    dot.style.background = d.color;
    const name = document.createElement('span');
    name.textContent = d.name;
    item.appendChild(dot);
    item.appendChild(name);
    legendGrid.appendChild(item);
  }
  if (legendNote) legendNote.textContent = DATA.legendNote;
  updateViewToggle();
}
function publicState() {
  return {
    pointer: pointerState,
    nodes: nodes.length,
    links: links.length,
    zoom: cam.zoom,
    fps: fps,
    tension: band ? band.tension : 0,
    mode: viewMode,
    focus: focus ? focus.id : null,
    simAlpha: SIM.alpha,
    labels: labelsShown.size
  };
}
const testApi = {
  screenOf(id) {
    const n = getNode(id);
    if (!n) return null;
    const p = nodeScreenCenter(n);
    return { x: p.x, y: p.y };
  },
  screenOfLink(a, b, t) {
    const l = findLinkBetween(a, b);
    if (!l) return null;
    return pointOnLinkScreen(l, t == null ? 0.5 : t);
  },
  expand(id) {
    const n = getNode(id);
    if (n) handleDouble(n, performance.now());
  },
  capture(text) {
    input.value = text == null ? '' : String(text);
    if (input.value.trim()) submitIdea(input.value);
    else onInputChanged();
  },
  focus(id) {
    const n = getNode(id);
    if (n) setFocus(n, performance.now());
  },
  unfocus() { clearFocus(); },
  setMode(mode) {
    if (mode !== 'ball' && mode !== 'text') return;
    if (viewMode === mode) return;
    viewMode = mode;
    simReheat(CFG.force.reheat.mode);
    updateViewToggle();
    placeLabels(performance.now());
    scheduleRefitChecks();
  },
  refit() { refitCamera(performance.now()); },
  bounds() { return currentBounds(); },
  setForces(v, animate) {
    if (!forcesPanel) return;
    forcesPanel.setValues(v, !!animate);
    forcesPanel.setMode('manual');
  },
  getForces() {
    return forcesPanel ? forcesPanel.getValues() : Object.assign({}, FORCES);
  },
  preset(name) {
    if (!forcesPanel || !PRESETS[name]) return;
    forcesPanel.setValues(PRESETS[name], false);
    forcesPanel.setMode(name);
  },
  rearrange() {
    return forcesPanel ? forcesPanel.rearrange() : Promise.resolve(false);
  },
  metrics() {
    const live = nodes.filter(n => !n.removing);
    const items = live.filter(n => n.type === 'item');
    const struct = links.filter(l => l.kind === 'struct');
    const len = struct.map(l => { const a = getNode(l.a), b = getNode(l.b); return a && b ? Math.hypot(a.pos.x - b.pos.x, a.pos.y - b.pos.y) : 0; });
    const st = getForcesStats();
    return { nearestMin: st.nearestMin, labelOverlaps: st.labelOverlaps, fits: st.fits, bounds: currentBounds(),
             itemSpread: items.length ? items.reduce((s, n) => s + Math.hypot(n.pos.x, n.pos.y), 0) / items.length : 0,
             meanStructLen: len.length ? len.reduce((s, v) => s + v, 0) / len.length : 0 };
  },
  labelsShown() { return Array.from(labelsShown); },
  labelOverlaps() { return labelOverlapCount(); },
  ballOverlaps() { return ballOverlapCount(); },
  simAlpha() { return SIM.alpha; },
  nodeColor(id) { const n = getNode(id); return n ? n.hue : null; },
  tool(name) { setTool(name); },
  brushKind(kind) { setBrushKind(kind); },
  hint(a, b) { return hintFor(a, b); },
  connect(a, b) {
    const x = getNode(a), y = getNode(b);
    return !!(x && y && connectNodes(x, y));
  },
  note(a, b, text) {
    const l = findLinkBetween(a, b);
    if (!l) return false;
    l.note = String(text == null ? '' : text).trim().slice(0, 24);
    return true;
  },
  brush(a, b, kind) {
    const l = findLinkBetween(a, b);
    if (!l || ['support', 'conflict', 'unsure', 'clear'].indexOf(kind) < 0) return false;
    l.brush = kind === 'clear' ? null : kind;
    l.brushStart = kind === 'clear' ? 0 : performance.now();
    l.brushT0 = 0.5;
    return true;
  },
  cut(a, b) {
    const l = findLinkBetween(a, b);
    if (!l) return false;
    const g = lineGeometry(l);
    if (!g) return false;
    const m = pointAtPolyline(g.points, 0.5);
    const A = nodeScreenCenter(getNode(a)), B = nodeScreenCenter(getNode(b));
    let dx = B.x - A.x, dy = B.y - A.y;
    const len = Math.hypot(dx, dy) || 1;
    const dir = { x: -dy / len, y: dx / len };
    ensureAudio();
    cutLink(l, m, dir, performance.now());
    return true;
  },
  undoCut() { undoCut(); },
  overlaps() { return labelOverlapCount(); }
};
window.__star = {
  CFG: CFG,
  DATA: DATA,
  nodes: nodes,
  links: links,
  cam: cam,
  audioLog: audioLog,
  llm: LLM,
  pairCache: pairCache,
  state: publicState,
  test: testApi
};

/* ---------- 初始化 ---------- */
/* FORCES-PANEL:BEGIN */
/* 布局力面板：向心力、排斥力、连线吸引力、连线长度（参考 Obsidian 图谱的 Forces），
   加四种方式：Claude 调的一组 / Gemini 调的一组 / 手动拖滑块 / DeepSeek 重排。
   自包含：自己注入样式、自己建 DOM，不依赖页面里的任何变量。

   const panel = createForcesPanel({
     mode: '2d',                       // '2d' 或 '3d'，只用来告诉 DeepSeek 要不要给 z
     presets: { claude: {center, repel, link, distance}, gemini: {…} },   // 四个数都在 0 到 1
     initial: { center, repel, link, distance },  initialMode: 'claude',
     modelReady: false,                // 能不能用 DeepSeek（页面是通过本机服务打开的才为 true）
     getStats: () => ({ nodes, links, ideas, labelOverlaps, fits, nearestMin, constellations: [{id,title,members,ideas,status}] }),
     onChange: (values) => {},         // 数值每变一次就调用一次（拖滑块、预设过渡的每一帧、重排）
     applyAnchors: (anchors) => {}     // DeepSeek 给的星座目标位置 [{id,x,y,z?}]，x,y,z 都在 -1 到 1
   });
   panel.setValues({center:0.5}, animate)  panel.getValues()  panel.mode()  panel.setMode('manual')
   panel.open()  panel.close()  panel.isOpen()  panel.setModelReady(true)  panel.rearrange()  panel.setWhy('一句话')
*/
function createForcesPanel(opts) {
  opts = opts || {};
  var ROWS = [
    ['center', '向心力', '把所有节点往中间拉，越大越集中'],
    ['repel', '排斥力', '节点之间互相推开，越大越松'],
    ['link', '连线吸引力', '相连的节点互相拉近'],
    ['distance', '连线长度', '相连节点之间的距离']
  ];
  var CHIPS = [['claude', 'Claude'], ['gemini', 'Gemini'], ['manual', '手动'], ['deepseek', 'DeepSeek 重排']];
  var st = {
    values: Object.assign({ center: 0.5, repel: 0.5, link: 0.5, distance: 0.5 }, opts.initial || {}),
    mode: opts.initialMode || 'claude', busy: false, modelReady: !!opts.modelReady, tween: 0, open: false
  };
  var presets = opts.presets || {};

  if (!document.getElementById('forces-panel-style')) {
    var css = document.createElement('style');
    css.id = 'forces-panel-style';
    css.textContent =
      '#forces-btn{pointer-events:auto;width:24px;height:24px;padding:0;border:0;background:transparent;color:#EEF1FA;opacity:.5;cursor:pointer;display:grid;place-items:center}' +
      '#forces-btn:hover,#forces-btn.on{opacity:.92}#forces-btn svg{width:20px;height:20px;display:block}' +
      '#forces-panel{position:fixed;top:56px;right:24px;width:292px;z-index:9;padding:14px 16px 12px;border-radius:12px;background:rgba(14,18,32,.88);' +
      '-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);color:#EEF1FA;' +
      'font:12px/1.45 var(--font,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif);display:none;user-select:none}' +
      '#forces-panel.open{display:block}' +
      '#forces-panel .fp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:600}' +
      '#forces-panel .fp-x{border:0;background:transparent;color:#EEF1FA;opacity:.55;cursor:pointer;font-size:16px;line-height:1;padding:0 2px}' +
      '#forces-panel .fp-x:hover{opacity:.95}' +
      '#forces-panel .fp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}' +
      '#forces-panel .fp-chip{height:26px;padding:0 10px;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#EEF1FA;opacity:.7;cursor:pointer;font:inherit}' +
      '#forces-panel .fp-chip:hover{opacity:1}' +
      '#forces-panel .fp-chip.on{opacity:1;border-color:rgba(220,211,255,.75);background:rgba(155,123,255,.2)}' +
      '#forces-panel .fp-chip[disabled]{opacity:.32;cursor:not-allowed}' +
      '#forces-panel .fp-row{margin:8px 0 10px}' +
      '#forces-panel .fp-lab{display:flex;justify-content:space-between;margin-bottom:3px}' +
      '#forces-panel .fp-lab span:last-child{opacity:.6;font-variant-numeric:tabular-nums}' +
      '#forces-panel input[type=range]{width:100%;margin:0;accent-color:#9B7BFF;cursor:pointer}' +
      '#forces-panel .fp-why{min-height:17px;margin-top:6px;opacity:.7;font-size:12px}';
    document.head.appendChild(css);
  }

  var btn = document.createElement('button');
  btn.id = 'forces-btn';
  btn.type = 'button';
  btn.title = '布局力：向心力、排斥力、连线吸引力、连线长度';
  btn.setAttribute('aria-label', '布局力');
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16M9 5v4M15 10v4M7 15v4"/></svg>';
  var host = document.getElementById('top-right');
  var mute = document.getElementById('mute');
  if (host) host.insertBefore(btn, mute && mute.parentNode === host ? mute : null);
  else { btn.style.cssText = 'position:fixed;top:22px;right:60px;z-index:9;opacity:.6'; document.body.appendChild(btn); }

  var panel = document.createElement('div');
  panel.id = 'forces-panel';
  var html = '<div class="fp-head"><span>布局力</span><button class="fp-x" type="button" aria-label="关闭">×</button></div><div class="fp-chips">';
  CHIPS.forEach(function (c) { html += '<button class="fp-chip" type="button" data-mode="' + c[0] + '">' + c[1] + '</button>'; });
  html += '</div>';
  ROWS.forEach(function (r) {
    html += '<div class="fp-row" title="' + r[2] + '"><div class="fp-lab"><span>' + r[1] + '</span><span data-val="' + r[0] + '"></span></div>' +
            '<input type="range" min="0" max="100" step="1" data-key="' + r[0] + '"></div>';
  });
  html += '<div class="fp-why"></div>';
  panel.innerHTML = html;
  document.body.appendChild(panel);
  ['pointerdown', 'pointerup', 'click', 'wheel'].forEach(function (t) {
    panel.addEventListener(t, function (e) { e.stopPropagation(); });
    btn.addEventListener(t, function (e) { e.stopPropagation(); });
  });

  var chipEls = panel.querySelectorAll('.fp-chip');
  var sliders = panel.querySelectorAll('input[type=range]');
  var whyEl = panel.querySelector('.fp-why');

  function notify() { if (opts.onChange) opts.onChange(Object.assign({}, st.values)); }
  function render() {
    chipEls.forEach(function (el) {
      var m = el.getAttribute('data-mode');
      el.classList.toggle('on', st.mode === m);
      el.setAttribute('aria-pressed', st.mode === m ? 'true' : 'false');
      if (m === 'deepseek') {
        el.disabled = !st.modelReady || st.busy;
        el.textContent = st.busy ? 'DeepSeek …' : 'DeepSeek 重排';
        el.title = st.modelReady ? '请 DeepSeek 看一眼这张图，给出一组新的数值和星座位置' : '需要通过本机服务打开（双击 start-star.bat）才能用';
      }
    });
    sliders.forEach(function (el) {
      var k = el.getAttribute('data-key');
      var v = Math.round(st.values[k] * 100);
      if (document.activeElement !== el || !st.tween) el.value = v;
      var out = panel.querySelector('[data-val="' + k + '"]');
      if (out) out.textContent = v;
    });
    btn.classList.toggle('on', st.open);
  }
  function setWhy(t) { whyEl.textContent = t || ''; }
  function clamp01(v) { v = Number(v); return v === v ? Math.max(0, Math.min(1, v)) : 0.5; }

  function setValues(v, animate) {
    cancelAnimationFrame(st.tween); st.tween = 0;
    var target = {}, from = Object.assign({}, st.values);
    ROWS.forEach(function (r) { var k = r[0]; target[k] = v && v[k] != null ? clamp01(v[k]) : st.values[k]; });
    if (!animate) { st.values = target; render(); notify(); return; }
    var t0 = performance.now(), ms = 800;
    (function step(now) {
      var p = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - p, 3);
      ROWS.forEach(function (r) { var k = r[0]; st.values[k] = from[k] + (target[k] - from[k]) * e; });
      render(); notify();
      if (p < 1) st.tween = requestAnimationFrame(step); else st.tween = 0;
    })(t0);
  }
  function setMode(m) { st.mode = m; render(); }
  function open() { st.open = true; panel.classList.add('open'); render(); }
  function close() { st.open = false; panel.classList.remove('open'); render(); }

  function rearrange() {
    if (st.busy || !st.modelReady) return Promise.resolve(false);
    st.busy = true; render(); setWhy('DeepSeek 想一想…');
    var ctrl = new AbortController(), to = setTimeout(function () { ctrl.abort(); }, 15000);
    var body = { mode: opts.mode || '2d', viewport: [innerWidth, innerHeight], current: Object.assign({}, st.values), stats: opts.getStats ? opts.getStats() : {} };
    return fetch('/api/layout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctrl.signal })
      .then(function (r) { clearTimeout(to); if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (res) {
        st.mode = 'deepseek';
        setValues({ center: res.center, repel: res.repel, link: res.link, distance: res.distance }, true);
        if (opts.applyAnchors && res.anchors && res.anchors.length) opts.applyAnchors(res.anchors);
        setWhy(res.why || '已重排');
        return true;
      })
      .catch(function () { clearTimeout(to); setWhy('没连上模型，保持现在的布局'); return false; })
      .then(function (ok) { st.busy = false; render(); return ok; });
  }

  chipEls.forEach(function (el) {
    el.addEventListener('click', function () {
      var m = el.getAttribute('data-mode');
      if (m === 'deepseek') { rearrange(); return; }
      st.mode = m;
      if (m === 'claude' || m === 'gemini') { if (presets[m]) { setValues(presets[m], true); setWhy(m === 'claude' ? 'Claude 调的一组' : 'Gemini 调的一组'); } }
      else setWhy('拖滑块自己调');
      render();
    });
  });
  sliders.forEach(function (el) {
    el.addEventListener('input', function () {
      cancelAnimationFrame(st.tween); st.tween = 0;
      st.values[el.getAttribute('data-key')] = clamp01(el.value / 100);
      st.mode = 'manual'; setWhy('手动');
      render(); notify();
    });
  });
  btn.addEventListener('click', function () { if (st.open) close(); else open(); });
  panel.querySelector('.fp-x').addEventListener('click', close);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && st.open) { close(); e.stopPropagation(); e.preventDefault(); }
  }, true);

  render();
  return {
    setValues: setValues, getValues: function () { return Object.assign({}, st.values); },
    mode: function () { return st.mode; }, setMode: setMode, open: open, close: close, isOpen: function () { return st.open; },
    setModelReady: function (b) { st.modelReady = !!b; render(); }, rearrange: rearrange, setWhy: setWhy
  };
}
/* FORCES-PANEL:END */

function init() {
  resizeCanvas();
  document.getElementById('badge').textContent = '离线 · 可能性文字是示例';
  addInitialNodes();
  buildInitialLinks();
  initialLayoutAndCamera();
  attachEvents();
  forcesPanel = createForcesPanel({
    mode: '2d', presets: PRESETS, initial: FORCES, initialMode: 'claude', modelReady: false,
    getStats: getForcesStats,
    onChange: function (v) { Object.assign(FORCES, v); simReheat(0.5); scheduleRefitChecks(true); },
    applyAnchors: applyAnchors
  });
  updateAudioStatus();
  buildLegend();
  updateToolUI();
  placeLabels(performance.now());
  initLLM();
  requestAnimationFrame(loop);
  input.focus({ preventScroll: true });
  setTimeout(() => {
    if (document.activeElement !== input && !input.value) input.focus({ preventScroll: true });
  }, 0);
}
init();
