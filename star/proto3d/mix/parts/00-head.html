<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星图 · 3D · 融合版</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #06080d;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  #stage.dragging-cam {
    cursor: grabbing;
  }
  #stage.hover-node, #stage.hover-link {
    cursor: pointer;
  }
  #stage.slashing {
    cursor: crosshair;
  }
  #op-hint {
    position: fixed;
    top: 18px;
    left: 22px;
    z-index: 15;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    color: rgba(203, 213, 225, 0.72);
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 1.4s ease;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
  }
  #op-hint.fade-out {
    opacity: 0;
  }
  #top-right {
    position: fixed;
    top: 14px;
    right: 18px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #version-tag {
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.03em;
    color: rgba(226, 232, 240, 0.78);
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.55);
    border: 1px solid rgba(148, 163, 184, 0.16);
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #mute {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid rgba(148, 163, 184, 0.18);
    background: rgba(15, 23, 42, 0.65);
    color: rgba(226, 232, 240, 0.82);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
  }
  #mute:hover {
    background: rgba(30, 41, 59, 0.85);
    border-color: rgba(148, 163, 184, 0.35);
    color: #ffffff;
  }
  #mute.is-muted {
    color: rgba(148, 163, 184, 0.45);
  }
  #legend {
    position: fixed;
    left: 22px;
    bottom: 20px;
    z-index: 15;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }
  .legend-items {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: rgba(203, 213, 225, 0.78);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
  }
  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 6px currentColor;
  }
  .legend-note {
    font-size: 11px;
    color: rgba(148, 163, 184, 0.56);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
  }
  #idea-wrap {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 25;
    width: 560px;
    max-width: calc(100vw - 32px);
  }
  #idea-input {
    width: 560px;
    max-width: 100%;
    height: 46px;
    padding: 0 20px;
    border-radius: 23px;
    border: 1px solid rgba(148, 163, 184, 0.24);
    background: rgba(13, 18, 30, 0.76);
    color: #f1f5f9;
    font-size: 14px;
    outline: none;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  #idea-input::placeholder {
    color: rgba(148, 163, 184, 0.62);
  }
  #idea-input:focus {
    border-color: rgba(148, 163, 184, 0.48);
    background: rgba(15, 23, 42, 0.86);
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.58), 0 0 0 3px rgba(148, 163, 184, 0.1);
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="op-hint">拖拽空白旋转视角 · 点球聚焦 · 拉线中间弹火花 · 快速划过切线（Ctrl+Z 撤回）</div>
  <div id="top-right">
    <span id="version-tag">3D · 融合版</span>
    <button id="mute" type="button" title="声音开关" aria-label="声音开关">🔊</button>
  </div>
  <div id="legend">
    <div class="legend-items" id="legend-items"></div>
    <div class="legend-note" id="legend-note"></div>
  </div>
  <div id="idea-wrap">
    <input id="idea-input" type="text" autocomplete="off" spellcheck="false" placeholder="想到什么，直接打，回车记下" />
  </div>
<script>
